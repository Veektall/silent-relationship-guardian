name: Temporary Elon AI Robots Clip

on:
  push:
    branches:
      - temp-elon-ai-robots-clip
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install downloader
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download exact social clip with fallbacks
        shell: bash
        run: |
          set -u
          mkdir -p out work
          ok=0

          echo "Trying the exact 2:56 DogeDesigner clip from X..."
          if yt-dlp \
            --no-playlist \
            -f 'bv*+ba/b' \
            --merge-output-format mp4 \
            --remux-video mp4 \
            -o 'work/source.%(ext)s' \
            'https://x.com/cb_doge/status/2087313113230000204'; then
            src="$(find work -maxdepth 1 -type f -name 'source.*' | head -n1)"
            if [ -n "$src" ]; then
              ffmpeg -y -i "$src" -map 0:v:0 -map 0:a? -c copy -movflags +faststart 'out/elon-musk-future-overwhelmingly-ai-and-robots.mp4' || \
              ffmpeg -y -i "$src" -map 0:v:0 -map 0:a? -c:v libx264 -preset medium -crf 18 -c:a aac -b:a 192k -movflags +faststart 'out/elon-musk-future-overwhelmingly-ai-and-robots.mp4'
              ok=1
            fi
          fi

          if [ "$ok" -eq 0 ]; then
            echo "X download failed; trying 24vids mirror..."
            rm -f work/source.*
            if yt-dlp \
              --no-playlist \
              -f 'bv*+ba/b' \
              --merge-output-format mp4 \
              --remux-video mp4 \
              -o 'work/source.%(ext)s' \
              'https://www.24vids.com/video/elon-musk-on-groki-think-an-ai-that-is-sort-of-spacexs-baby-will-be-a-very-p-tw-2087313113230000204'; then
              src="$(find work -maxdepth 1 -type f -name 'source.*' | head -n1)"
              if [ -n "$src" ]; then
                ffmpeg -y -i "$src" -map 0:v:0 -map 0:a? -c copy -movflags +faststart 'out/elon-musk-future-overwhelmingly-ai-and-robots.mp4' || \
                ffmpeg -y -i "$src" -map 0:v:0 -map 0:a? -c:v libx264 -preset medium -crf 18 -c:a aac -b:a 192k -movflags +faststart 'out/elon-musk-future-overwhelmingly-ai-and-robots.mp4'
                ok=1
              fi
            fi
          fi

          if [ "$ok" -eq 0 ]; then
            echo "Mirror failed; extracting the quote directly from the full SpaceX talk on YouTube..."
            rm -f work/source.*
            yt-dlp \
              --no-playlist \
              --download-sections '*20:08-21:02' \
              --force-keyframes-at-cuts \
              -f 'bv*+ba/b' \
              --merge-output-format mp4 \
              --remux-video mp4 \
              -o 'out/elon-musk-future-overwhelmingly-ai-and-robots.%(ext)s' \
              'https://youtu.be/kwNyUTH0asI'
          fi

          test -s 'out/elon-musk-future-overwhelmingly-ai-and-robots.mp4'
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 'out/elon-musk-future-overwhelmingly-ai-and-robots.mp4'

      - name: Upload clip artifact
        uses: actions/upload-artifact@v4
        with:
          name: elon-ai-robots-clip
          path: out/elon-musk-future-overwhelmingly-ai-and-robots.mp4
          if-no-files-found: error
          retention-days: 1
