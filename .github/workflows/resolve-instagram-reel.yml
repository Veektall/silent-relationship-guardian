name: Temporary Instagram media URL resolver

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resolve-instagram-reel.yml"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Resolve direct media URL
        run: |
          echo "MEDIA_URL_START"
          yt-dlp --no-playlist -f "best[ext=mp4]/best" -g "https://www.instagram.com/reel/DfXHXn6x9HJ/"
          echo "MEDIA_URL_END"
